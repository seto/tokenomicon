version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/tests/integration"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns: ["*"]
