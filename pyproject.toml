[build-system]
requires = ["setuptools~=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomicon"
version = "0.1.1"
description = "Post-hoc financial divination tool for LLM hunger and budget dread."
readme = "README.md"
authors = [{ name="seto" }]
license = { text="Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black~=26.5",
    "build~=1.5",
    "invoke~=3.0",
    "isort~=8.0",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "twine>=6.2,<8.0"
]
integration = [
    "anthropic~=0.117",
    "google-genai~=2.12",
    "openai~=2.46",
    "python-dotenv~=1.2",
]

[project.urls]
Source = "https://github.com/seto/tokenomicon"
Changelog = "https://github.com/seto/tokenomicon/blob/master/CHANGES.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenomicon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]
extend-exclude = '''
(
    ^/src/tokenomicon/currencies.py
)
'''

[tool.isort]
profile = "black"
line_length = 88
