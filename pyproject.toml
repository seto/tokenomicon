[build-system]
requires = ["setuptools>=83,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomicon"
version = "0.3.0"
description = "Post-hoc financial divination tool for LLM hunger and budget dread."
readme = "README.md"
authors = [{ name="seto" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black~=26.5",
    "build~=1.5",
    "invoke~=3.0",
    "isort>=8,<10",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "ruff~=0.16",
    "twine>=6.2,<8.0"
]
integration = [
    "anthropic>=0.117,<2.0",
    "google-genai~=2.12",
    "openai>=2.46,<4.0",
    "python-dotenv~=1.2",
]

[project.urls]
Source = "https://github.com/seto/tokenomicon"
Changelog = "https://github.com/seto/tokenomicon/blob/master/CHANGES.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenomicon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]
extend-exclude = '''
(
    ^/src/tokenomicon/currencies.py
)
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/tokenomicon/currencies.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear 
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify 
    "FURB", # refurb
]
ignore = ["E501"]  # Ignore line length errors, as Black handles formatting
